<script>
// 새로고침용으로 붙은 ?_=숫자 는 주소창에서 바로 지웁니다.
try{const u=new URL(location.href);if(u.searchParams.has('_')){u.searchParams.delete('_');history.replaceState(null,'',u.pathname+u.search+u.hash);}}catch{}
const el=id=>document.getElementById(id);
const cfg=window.STBY_CONFIG||{};
// 인쇄 기능은 주소 끝에 ?print=1 을 붙였을 때만 보입니다. (프린터가 연결된 컴퓨터용)
const PRINT_UI=new URLSearchParams(location.search).get('print')==='1';
el('auto').parentElement.hidden=!PRINT_UI;
const DAY=24*60*60*1000;
let adapter=null,unsub=null,tickets=new Map(),seen=null,audio=null,printing=Promise.resolve();
try{el('auto').checked=localStorage.getItem('stby-kitchen-auto')==='1';}catch{}
el('auto').onchange=()=>{try{localStorage.setItem('stby-kitchen-auto',el('auto').checked?'1':'0');}catch{}};
let lastRecv=null;
let wake=null;
async function keepAwake(){
 try{if('wakeLock' in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen');}catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();if(adapter&&subscribed){const go=()=>resubscribe();if(adapter.reconnect)adapter.reconnect().then(go,go);else go();}}});
setInterval(()=>{if(adapter&&subscribed&&document.visibilityState==='visible'&&lastRecv&&Date.now()-lastRecv.getTime()>10*60*1000&&adapter.reconnect)adapter.reconnect().catch(()=>{});},5*60*1000);
keepAwake();
function status(text,warn){el('status').textContent=text;el('status').className=warn?'warn':'';}
const fmtPickup=hm=>{const m=/^(\d{1,2}):(\d{2})$/.exec(hm||'');if(!m)return '';const h=Number(m[1]);return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+m[2];};
function tlabel(ticket,full){
 if(ticket.table>9)return '🥡 TOGO '+(ticket.table-9)+(ticket.togo&&ticket.togo.name?' · '+ticket.togo.name:'');
 return ticket.table+'번 테이블';
}
function fill(container,ticket){
 container.replaceChildren();
 const add=(text,cls)=>{const p=document.createElement('p');p.className=cls||'';p.textContent=text;container.append(p);return p;};
 const head=add(tlabel(ticket,true),'t-head');
 if(ticket.extra){const tag=document.createElement('span');tag.className='extra';tag.textContent='추가 주문';head.append(' ',tag);}
 add(new Date(ticket.time).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})+(ticket.party?' · '+ticket.party+'명':'')+(ticket.staff?' · 주문 '+ticket.staff:'')+(ticket.togo&&ticket.togo.pickup?' · ⏰ 픽업 '+fmtPickup(ticket.togo.pickup):''),'t-sub');
 const rule=document.createElement('p');rule.className='t-rule';container.append(rule);
 for(const item of ticket.items){
  add(item.qty+' × '+item.ko+(item.s?' 🌶':'')+(item.total>item.qty?' (총 '+item.total+')':''),'t-item');
  if(item.en)add(item.en,'t-sub');
  if(item.note)add(item.note,'t-sub');
  if(item.t)add('⏱ '+item.t+'분 소요','t-sub');
  if(item.memo)add('★ '+item.memo,'t-memo');
 }
 if(ticket.cancels&&ticket.cancels.length){
  const rule2=document.createElement('p');rule2.className='t-rule';container.append(rule2);
  add('✕ 취소','t-cancel-head');
  for(const c of ticket.cancels)add('✕ '+c.qty+' × '+c.ko,'t-item t-cancel');
 }
}
let printJobs=0;
function printTicket(ticket){
 // 여러 장이 겹치지 않게 순서대로 인쇄
 printJobs++;
 printing=printing.then(()=>new Promise(resolve=>{
  fill(el('printArea'),ticket);
  setTimeout(()=>{window.print();setTimeout(()=>{printJobs--;resolve();},1500);},50);
 }));
}
// ---------- 알림 소리: 항상 켜짐 (iOS는 화면을 한 번 터치해야 소리가 허용됩니다) ----------
function makeSilentAudio(){
 // 무음 파일을 계속 재생해 무음 스위치가 켜져 있어도 소리가 나게 합니다.
 const n=800,bytes=new Uint8Array(44+n);
 const w=(o,s)=>[...s].forEach((c,i)=>bytes[o+i]=c.charCodeAt(0));
 const u32=(o,v)=>{bytes[o]=v&255;bytes[o+1]=v>>8&255;bytes[o+2]=v>>16&255;bytes[o+3]=v>>24&255;};
 w(0,'RIFF');u32(4,36+n);w(8,'WAVE');w(12,'fmt ');u32(16,16);bytes[20]=1;bytes[22]=1;u32(24,8000);u32(28,8000);bytes[32]=1;bytes[34]=8;w(36,'data');u32(40,n);
 bytes.fill(128,44);
 const a=new Audio(URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})));
 a.loop=true;a.setAttribute('playsinline','');return a;
}
let silent=null;
async function unlockSound(){
 try{if('audioSession' in navigator)navigator.audioSession.type='playback';}catch{}
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();}catch{return;}
 try{await audio.resume();}catch{}
 try{silent=silent||makeSilentAudio();await silent.play();}catch{}
 refreshSound();
}
const soundReady=()=>!!audio&&audio.state==='running';
function refreshSound(){
 const ok=soundReady();
 el('sound').textContent=ok?'🔔 소리 켜짐':'🔕 소리 꺼짐 · 화면을 눌러 켜기';
 el('sound').className=ok?'':'soundoff';
}
function onFirstGesture(){
 unlockSound().then(()=>{
  if(soundReady())['pointerdown','touchstart','keydown','click'].forEach(ev=>document.removeEventListener(ev,onFirstGesture,true));
 });
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,onFirstGesture,true));
setInterval(refreshSound,2000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&audio){audio.resume().catch(()=>{});refreshSound();}});
// 현관 초인종 같은 "딩동" 소리 (부드럽게 울렸다가 사라지는 종소리)
function chime(start,freq,volume){
 const master=audio.createGain();master.gain.value=volume;master.connect(audio.destination);
 [[1,1],[2.01,0.35],[3.0,0.12]].forEach(([mult,level])=>{
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type='sine';osc.frequency.value=freq*mult;
  gain.gain.setValueAtTime(0.0001,start);
  gain.gain.exponentialRampToValueAtTime(level,start+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+1.5);
  osc.connect(gain);gain.connect(master);osc.start(start);osc.stop(start+1.6);
 });
}
function alarm(){
 if(!soundReady())return;
 try{
  const t0=audio.currentTime+0.05;
  for(let round=0;round<2;round++){
   chime(t0+round*2.2,659.25,0.9);       // 딩 (미)
   chime(t0+round*2.2+0.6,523.25,0.9);   // 동 (도)
  }
 }catch{}
}
el('sound').onclick=async()=>{await unlockSound();alarm();};
function setDone(ticket,done){
 const next={...ticket,done,doneAt:done?new Date().toISOString():null};
 tickets.set(ticket.id,next);render();
 adapter.write({tickets:{[ticket.id]:JSON.stringify(next)}}).catch(()=>status('저장 실패 · 다시 눌러 주세요',true));
}
function card(ticket,fresh){
 const node=document.createElement('section');
 node.className='card'+(ticket.table>9?' togo':'')+(ticket.done?' done':'')+(fresh?' fresh':'')+(ticket.cancels&&ticket.cancels.length?' has-cancel':'');
 const body=document.createElement('div');fill(body,ticket);
 const actions=document.createElement('div');actions.className='actions';
 const doneBtn=document.createElement('button');doneBtn.type='button';
 doneBtn.textContent=ticket.done?'되돌리기':'✓ 완료';if(!ticket.done)doneBtn.className='ok';
 doneBtn.onclick=()=>setDone(ticket,!ticket.done);
 const printBtn=document.createElement('button');printBtn.type='button';printBtn.textContent='🖨 인쇄';
 printBtn.onclick=()=>printTicket(ticket);
 actions.append(doneBtn);if(PRINT_UI)actions.append(printBtn);node.append(body,actions);return node;
}
let freshIds=new Set();
let doneTicket=null;
function showDone(ticket){
 if(el('doneDlg').open)return;
 doneTicket=ticket;fill(el('doneBody'),ticket);el('doneDlg').showModal();
}
el('doneClose').onclick=()=>el('doneDlg').close();
el('doneUndo').onclick=()=>{if(doneTicket)setDone(doneTicket,false);el('doneDlg').close();};
function chip(ticket){
 const b=document.createElement('button');b.type='button';b.className='chip'+(ticket.table>9?' togo':'');
 b.textContent=ticket.table>9?'🥡 T'+(ticket.table-9):ticket.table+'번';
 const small=document.createElement('small');
 small.textContent=new Date(ticket.time).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
 b.append(small);
 let last=0;
 b.onclick=()=>{const now=Date.now();if(now-last<450){last=0;showDone(ticket);}else last=now;};
 return b;
}
function render(){
 const now=Date.now();
 const list=[...tickets.values()].filter(t=>now-new Date(t.time).getTime()<DAY);
 // 새 주문이 왼쪽, 오래된 주문일수록 오른쪽
 const pending=list.filter(t=>!t.done).sort((a,b)=>a.time<b.time?1:a.time>b.time?-1:0);
 const done=list.filter(t=>t.done).sort((a,b)=>(a.doneAt||a.time)<(b.doneAt||b.time)?1:-1).slice(0,40);
 el('pendingCount').textContent=pending.length?'('+pending.length+')':'';
 el('pending').replaceChildren(...(pending.length?pending.map(t=>card(t,freshIds.has(t.id))):[Object.assign(document.createElement('p'),{className:'empty',textContent:'조리할 주문이 없습니다.'})]));
 el('done').replaceChildren(...(done.length?done.map(chip):[Object.assign(document.createElement('p'),{className:'empty',textContent:'완료한 주문이 없습니다.'})]));
}
function onTickets(map){
 const first=seen===null;
 if(first)seen=new Set();
 const incoming=[];
 for(const [id,json] of Object.entries(map)){
  let t;try{t=JSON.parse(json);}catch{continue;}
  if(!t||t.id!==id||!Array.isArray(t.items))continue;
  tickets.set(id,t);
  if(!seen.has(id)){seen.add(id);if(!first&&!t.done)incoming.push(t);}
 }
 freshIds=new Set(incoming.map(t=>t.id));
 render();
 if(incoming.length){
  alarm();
  if(PRINT_UI&&el('auto').checked)incoming.sort((a,b)=>a.time<b.time?-1:1).forEach(printTicket);
  setTimeout(()=>{freshIds=new Set();},3000);
 }
 lastRecv=new Date();
 status(navigator.onLine?'연결됨 · 마지막 수신 '+lastRecv.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',second:'2-digit'}):'오프라인 · 연결되면 자동 갱신',!navigator.onLine);
}
function showGate(show,msg,login){
 el('gate').hidden=!show;if(msg!==undefined)el('gateMsg').textContent=msg;
 el('pwRow').hidden=!login;el('loginBtn').hidden=!login;
}
function loadScriptTag(src){
 return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('network'));document.head.append(s);});
}
async function loadAdapter(){
 if(window.StbyFirebase)return;
 const v=(document.querySelector('meta[name=build]')||{}).content||'';
 const viaFetch=async()=>{
  const r=await fetch('sync.bundle.js?r='+Date.now(),{cache:'reload'});
  if(!r.ok)throw new Error('http '+r.status);
  const text=await r.text();
  await loadScriptTag(URL.createObjectURL(new Blob([text],{type:'text/javascript'})));
 };
 const attempts=[()=>loadScriptTag('sync.bundle.js?v='+v),viaFetch,()=>loadScriptTag('sync.bundle.js?v='+v+'&t='+Date.now())];
 let lastError=null;
 for(const attempt of attempts){
  try{await attempt();if(window.StbyFirebase)return;lastError=new Error('empty');}
  catch(error){lastError=error;}
  await new Promise(r=>setTimeout(r,1200));
 }
 throw lastError||new Error('load');
}
function freshReload(){
 try{sessionStorage.setItem('stby-upd',String(Date.now()));}catch{}
 const u=new URL(location.href);u.searchParams.set('_',Date.now());location.replace(u.toString());
}
let subscribed=false;
function resubscribe(){
 if(unsub){unsub();unsub=null;}
 status('불러오는 중…');
 unsub=adapter.subscribe({
  tickets:onTickets,
  error:e=>status('연결 오류 ('+(e.code||e.message)+')',true)
 });
}
el('resync').onclick=resubscribe;
// 실시간 연결이 멈춰도 새 주문이 늦지 않도록 8초마다 최근 변경분만 직접 확인합니다.
let pollSince=Date.now();
async function pollTickets(){
 if(!adapter||!subscribed||seen===null||!adapter.poll||document.visibilityState!=='visible'||!navigator.onLine)return;
 try{
  const r=await adapter.poll(['tickets'],Math.max(0,pollSince-120000));
  if(r.tickets.max)pollSince=Math.max(pollSince,r.tickets.max);
  if(Object.keys(r.tickets.map).length)onTickets(r.tickets.map);
 }catch{}
}
setInterval(pollTickets,8000);
async function start(){
 if(!(cfg.firebase&&cfg.firebase.apiKey)){showGate(true,'동기화 설정이 없습니다. config.js를 확인하세요.',false);return;}
 if(adapter)return;
 el('gateTools').hidden=true;
 showGate(true,'로그인 확인 중…',false);
 try{await loadAdapter();}catch{showGate(true,'모듈을 불러오지 못했습니다. ('+(navigator.onLine?'서버에서 받지 못함':'인터넷 연결 없음')+') 아래 버튼을 눌러 다시 시도하세요.',false);el('gateTools').hidden=false;return;}
 adapter=window.StbyFirebase.create(cfg.firebase,{memory:true});
 adapter.onAuth(user=>{
  if(user){
   showGate(false);subscribed=true;seen=null;resubscribe();
  }else{
   if(unsub){unsub();unsub=null;}
   subscribed=false;
   showGate(true,'가게 비밀번호를 입력하세요.',true);
  }
 });
}
el('loginForm').onsubmit=async event=>{
 event.preventDefault();el('gateErr').textContent='';el('loginBtn').disabled=true;
 try{await adapter.signIn(cfg.storeEmail,el('pw').value);el('pw').value='';}
 catch(e){const c=e&&e.code||'';el('gateErr').textContent=c==='auth/network-request-failed'?'인터넷에 연결되어 있어야 로그인할 수 있습니다.':/invalid|wrong|user-not-found/.test(c)?'비밀번호가 맞지 않습니다.':'로그인 오류: '+(c||e.message);}
 finally{el('loginBtn').disabled=false;}
};
el('gateRetry').onclick=()=>start();
el('gateReload').onclick=()=>freshReload();
el('logout').onclick=()=>{if(adapter)adapter.signOut();};
(function(){
 // 주방 화면은 새 버전이 나오면 알림 없이 스스로 새로고침합니다. (주문서는 서버에 있으므로 사라지지 않습니다.)
 if(!/^https?:/.test(location.protocol))return;
 const BUILD=(document.querySelector('meta[name=build]')||{}).content||'';
 const recent=()=>{try{return Date.now()-Number(sessionStorage.getItem('stby-upd')||0)<120000;}catch{return false;}};
 const check=async()=>{
  try{
   const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});
   const j=await r.json();
   if(!(j&&j.build&&BUILD&&String(j.build)>BUILD)||recent()||printJobs>0)return;
   try{sessionStorage.setItem('stby-upd',String(Date.now()));}catch{}
   const u=new URL(location.href);u.searchParams.set('_',Date.now());location.replace(u.toString());
  }catch{}
 };
 check();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
 setInterval(check,2*60*1000);
})();
addEventListener('online',()=>status('연결됨'));
addEventListener('offline',()=>status('오프라인 · 연결되면 자동 갱신',true));
setInterval(render,60000);
start();
</script></html>
