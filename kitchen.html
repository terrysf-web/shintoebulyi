<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="build" content="20261126063617"><title>Shin Toe Bul Yi 주방</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#202922;font:16px system-ui,sans-serif}
header{background:#193b30;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header strong{font-size:20px}.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid #c5cfc5;border-radius:9px;background:#fff;color:inherit;min-height:44px;padding:8px 14px}
header button{background:#ffffff1f;color:#fff;border-color:#ffffff66}header label{display:flex;gap:6px;align-items:center;font-size:14px}
#status{font-size:13px;color:#d8e7dd}#status.warn{color:#ffd9a8}
main{padding:16px 20px;max-width:1400px;margin:auto}h2{font-size:18px;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:#fff;border:2px solid #d4574c;border-radius:12px;padding:12px}.card.done{border-color:#d9ded5;opacity:.7}
.card.fresh{animation:flash 1.2s ease 2}@keyframes flash{50%{background:#fff3e0}}
.card p{margin:4px 0}.t-head{font-size:22px;font-weight:700}.t-sub{font-size:13px;color:#4e6559}
.t-item{font-size:20px;font-weight:700;margin-top:10px!important}.t-memo{font-size:16px;font-weight:700;color:#943e21}
.t-rule{border-top:2px dashed #9aa79d;margin:8px 0;height:0}.extra{background:#b3261e;color:#fff;border-radius:6px;padding:1px 8px;font-size:14px}
.card .actions{display:flex;gap:8px;margin-top:12px}.card .actions button{flex:1}
.ok{background:#245543;color:#fff;border-color:#245543}.empty{color:#4e6559;padding:12px 0}
.gate{position:fixed;inset:0;background:#f6f4ee;z-index:100;display:flex;align-items:center;justify-content:center}.gate[hidden]{display:none}
.gate form{background:#fff;border:1px solid #d9ded5;border-radius:14px;padding:24px;width:min(380px,90vw)}
.gate input{width:100%;padding:13px;border:1px solid #aebbb0;border-radius:10px;margin:8px 0;font:inherit}.gate [role=alert]{color:#943e21}
#printArea{display:none}
@media print{@page{size:80mm auto;margin:3mm}body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#000;background:#fff}#printArea .t-sub{color:#000}#printArea .t-memo{color:#000}}
</style>
<header><strong>주방 주문</strong><div class="hbtns"><span id="status">연결 중…</span>
<label><input type="checkbox" id="auto"> 새 주문 자동 인쇄</label>
<button type="button" id="resync">↻ 다시 연결</button>
<button type="button" id="sound">🔔 소리 켜기</button>
<button type="button" id="logout">로그아웃</button></div></header>
<main><h2>조리 중 <span id="pendingCount"></span></h2><div id="pending" class="grid"></div>
<h2>완료 (최근 20개)</h2><div id="done" class="grid"></div></main>
<div id="printArea"></div>
<div id="gate" class="gate"><form id="loginForm"><h2>신토불이 주방</h2><p id="gateMsg">로그인 확인 중…</p>
<label id="pwRow" hidden>가게 비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
<p id="gateErr" role="alert"></p><button type="submit" id="loginBtn" hidden>로그인</button></form></div>
<script src="config.js"></script>
<script>
const el=id=>document.getElementById(id);
const cfg=window.STBY_CONFIG||{};
const DAY=24*60*60*1000;
let adapter=null,unsub=null,tickets=new Map(),seen=null,soundOn=false,audio=null,printing=Promise.resolve();
try{el('auto').checked=localStorage.getItem('stby-kitchen-auto')==='1';}catch{}
el('auto').onchange=()=>{try{localStorage.setItem('stby-kitchen-auto',el('auto').checked?'1':'0');}catch{}};
let lastRecv=null;
let wake=null;
async function keepAwake(){
 try{if('wakeLock' in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen');}catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();if(adapter&&subscribed)resubscribe();}});
keepAwake();
function status(text,warn){el('status').textContent=text;el('status').className=warn?'warn':'';}
function fill(container,ticket){
 container.replaceChildren();
 const add=(text,cls)=>{const p=document.createElement('p');p.className=cls||'';p.textContent=text;container.append(p);return p;};
 const head=add(ticket.table+'번 테이블','t-head');
 if(ticket.extra){const tag=document.createElement('span');tag.className='extra';tag.textContent='추가 주문';head.append(' ',tag);}
 add(new Date(ticket.time).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})+(ticket.party?' · '+ticket.party+'명':'')+(ticket.staff?' · 주문 '+ticket.staff:''),'t-sub');
 const rule=document.createElement('p');rule.className='t-rule';container.append(rule);
 for(const item of ticket.items){
  add(item.qty+' × '+item.ko+(item.s?' 🌶':'')+(item.total>item.qty?' (총 '+item.total+')':''),'t-item');
  if(item.en)add(item.en,'t-sub');
  if(item.note)add(item.note,'t-sub');
  if(item.t)add('⏱ '+item.t+'분 소요','t-sub');
  if(item.memo)add('★ '+item.memo,'t-memo');
 }
}
let printJobs=0;
function printTicket(ticket){
 // 여러 장이 겹치지 않게 순서대로 인쇄
 printJobs++;
 printing=printing.then(()=>new Promise(resolve=>{
  fill(el('printArea'),ticket);
  setTimeout(()=>{window.print();setTimeout(()=>{printJobs--;resolve();},1500);},50);
 }));
}
function beep(){
 if(!soundOn||!audio)return;
 try{
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=880;g.gain.value=0.2;o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+0.35);
 }catch{}
}
el('sound').onclick=()=>{
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();soundOn=!soundOn;}catch{soundOn=false;}
 el('sound').textContent=soundOn?'🔔 소리 켜짐':'🔔 소리 켜기';
 if(soundOn)beep();
};
function setDone(ticket,done){
 const next={...ticket,done,doneAt:done?new Date().toISOString():null};
 tickets.set(ticket.id,next);render();
 adapter.write({tickets:{[ticket.id]:JSON.stringify(next)}}).catch(()=>status('저장 실패 · 다시 눌러 주세요',true));
}
function card(ticket,fresh){
 const node=document.createElement('section');
 node.className='card'+(ticket.done?' done':'')+(fresh?' fresh':'');
 const body=document.createElement('div');fill(body,ticket);
 const actions=document.createElement('div');actions.className='actions';
 const doneBtn=document.createElement('button');doneBtn.type='button';
 doneBtn.textContent=ticket.done?'되돌리기':'✓ 완료';if(!ticket.done)doneBtn.className='ok';
 doneBtn.onclick=()=>setDone(ticket,!ticket.done);
 const printBtn=document.createElement('button');printBtn.type='button';printBtn.textContent='🖨 인쇄';
 printBtn.onclick=()=>printTicket(ticket);
 actions.append(doneBtn,printBtn);node.append(body,actions);return node;
}
let freshIds=new Set();
function render(){
 const now=Date.now();
 const list=[...tickets.values()].filter(t=>now-new Date(t.time).getTime()<DAY);
 const pending=list.filter(t=>!t.done).sort((a,b)=>a.time<b.time?-1:1);
 const done=list.filter(t=>t.done).sort((a,b)=>a.time<b.time?1:-1).slice(0,20);
 el('pendingCount').textContent=pending.length?'('+pending.length+')':'';
 el('pending').replaceChildren(...(pending.length?pending.map(t=>card(t,freshIds.has(t.id))):[Object.assign(document.createElement('p'),{className:'empty',textContent:'조리할 주문이 없습니다.'})]));
 el('done').replaceChildren(...(done.length?done.map(t=>card(t,false)):[Object.assign(document.createElement('p'),{className:'empty',textContent:'완료한 주문이 없습니다.'})]));
}
function onTickets(map){
 const first=seen===null;
 if(first)seen=new Set();
 const incoming=[];
 for(const [id,json] of Object.entries(map)){
  let t;try{t=JSON.parse(json);}catch{continue;}
  if(!t||t.id!==id||!Array.isArray(t.items))continue;
  tickets.set(id,t);
  if(!seen.has(id)){seen.add(id);if(!first&&!t.done)incoming.push(t);}
 }
 freshIds=new Set(incoming.map(t=>t.id));
 render();
 if(incoming.length){
  beep();
  if(el('auto').checked)incoming.sort((a,b)=>a.time<b.time?-1:1).forEach(printTicket);
  setTimeout(()=>{freshIds=new Set();},3000);
 }
 lastRecv=new Date();
 status(navigator.onLine?'연결됨 · 마지막 수신 '+lastRecv.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',second:'2-digit'}):'오프라인 · 연결되면 자동 갱신',!navigator.onLine);
}
function showGate(show,msg,login){
 el('gate').hidden=!show;if(msg!==undefined)el('gateMsg').textContent=msg;
 el('pwRow').hidden=!login;el('loginBtn').hidden=!login;
}
function loadAdapter(){
 if(window.StbyFirebase)return Promise.resolve();
 return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='sync.bundle.js';s.onload=resolve;s.onerror=()=>reject(new Error('load'));document.head.append(s);});
}
let subscribed=false;
function resubscribe(){
 if(unsub){unsub();unsub=null;}
 status('불러오는 중…');
 unsub=adapter.subscribe({
  tables:()=>{},payments:()=>{},settings:()=>{},tickets:onTickets,
  error:e=>status('연결 오류 ('+(e.code||e.message)+')',true)
 });
}
el('resync').onclick=resubscribe;
async function start(){
 if(!(cfg.firebase&&cfg.firebase.apiKey)){showGate(true,'동기화 설정이 없습니다. config.js를 확인하세요.',false);return;}
 try{await loadAdapter();}catch{showGate(true,'모듈을 불러오지 못했습니다. 인터넷에 연결한 뒤 새로고침하세요.',false);return;}
 adapter=window.StbyFirebase.create(cfg.firebase);
 adapter.onAuth(user=>{
  if(user){
   showGate(false);subscribed=true;seen=null;resubscribe();
  }else{
   if(unsub){unsub();unsub=null;}
   subscribed=false;
   showGate(true,'가게 비밀번호를 입력하세요.',true);
  }
 });
}
el('loginForm').onsubmit=async event=>{
 event.preventDefault();el('gateErr').textContent='';el('loginBtn').disabled=true;
 try{await adapter.signIn(cfg.storeEmail,el('pw').value);el('pw').value='';}
 catch(e){const c=e&&e.code||'';el('gateErr').textContent=c==='auth/network-request-failed'?'인터넷에 연결되어 있어야 로그인할 수 있습니다.':/invalid|wrong|user-not-found/.test(c)?'비밀번호가 맞지 않습니다.':'로그인 오류: '+(c||e.message);}
 finally{el('loginBtn').disabled=false;}
};
el('logout').onclick=()=>{if(adapter)adapter.signOut();};
(function(){
 // 주방 화면은 새 버전이 나오면 알림 없이 스스로 새로고침합니다. (주문서는 서버에 있으므로 사라지지 않습니다.)
 if(!/^https?:/.test(location.protocol))return;
 const BUILD=(document.querySelector('meta[name=build]')||{}).content||'';
 const recent=()=>{try{return Date.now()-Number(sessionStorage.getItem('stby-upd')||0)<120000;}catch{return false;}};
 const check=async()=>{
  try{
   const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});
   const j=await r.json();
   if(!(j&&j.build&&BUILD&&String(j.build)>BUILD)||recent()||printJobs>0)return;
   try{sessionStorage.setItem('stby-upd',String(Date.now()));}catch{}
   const u=new URL(location.href);u.searchParams.set('_',Date.now());location.replace(u.toString());
  }catch{}
 };
 check();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
 setInterval(check,2*60*1000);
})();
addEventListener('online',()=>status('연결됨'));
addEventListener('offline',()=>status('오프라인 · 연결되면 자동 갱신',true));
setInterval(render,60000);
start();
</script></html>
