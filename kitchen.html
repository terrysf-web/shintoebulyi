<script>
// 새로고침용으로 붙은 ?_=숫자 는 주소창에서 바로 지웁니다.
try{const u=new URL(location.href);if(u.searchParams.has('_')){u.searchParams.delete('_');history.replaceState(null,'',u.pathname+u.search+u.hash);}}catch{}
const el=id=>document.getElementById(id);
const cfg=window.STBY_CONFIG||{};
// 인쇄 기능은 주소 끝에 ?print=1 을 붙였을 때만 보입니다. (프린터가 연결된 컴퓨터용)
const PRINT_UI=new URLSearchParams(location.search).get('print')==='1';
el('auto').parentElement.hidden=!PRINT_UI;
const DAY=24*60*60*1000;
let adapter=null,unsub=null,tickets=new Map(),seen=null,audio=null,printing=Promise.resolve();
try{el('auto').checked=localStorage.getItem('stby-kitchen-auto')==='1';}catch{}
el('auto').onchange=()=>{try{localStorage.setItem('stby-kitchen-auto',el('auto').checked?'1':'0');}catch{}};
let lastRecv=null;
let wake=null;
async function keepAwake(){
 try{if('wakeLock' in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen');}catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();if(adapter&&subscribed){const go=()=>resubscribe();if(adapter.reconnect)adapter.reconnect().then(go,go);else go();}}});
setInterval(()=>{if(adapter&&subscribed&&document.visibilityState==='visible'&&lastRecv&&Date.now()-lastRecv.getTime()>10*60*1000&&adapter.reconnect)adapter.reconnect().catch(()=>{});},5*60*1000);
keepAwake();
function status(text,warn){el('status').textContent=text;el('status').className=warn?'warn':'';}
const fmtPickup=hm=>{const m=/^(\d{1,2}):(\d{2})$/.exec(hm||'');if(!m)return '';const h=Number(m[1]);return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+m[2];};
function tlabel(ticket,full){
 if(ticket.table>9)return '🥡 TOGO '+(ticket.togo&&ticket.togo.no?'#'+ticket.togo.no:ticket.table-9)+(ticket.togo&&ticket.togo.name?' · '+ticket.togo.name:'');
 return ticket.table+'번 테이블';
}
// 카운터/폰에서 '나감'으로 표시한 내용을 테이블 문서에서 읽어 옵니다.
const tableServed=new Map();   // 테이블 번호 -> Map(메뉴이름 -> {served,qty})
const DIAG={sub:{},write:null,poll:null,err:null};
const ago=t=>t?Math.max(0,Math.round((Date.now()-t)/1000))+'초 전':'아직 없음';
function diagText(){
 const build=(document.querySelector('meta[name=build]')||{}).content||'?';
 return ['앱 버전: '+build,'인터넷: '+(navigator.onLine?'연결됨':'끊김'),'── 서버에서 마지막으로 받은 시각 ──','주문서: '+ago(DIAG.sub.tickets),'테이블: '+ago(DIAG.sub.tables),'── 보내기 ──','마지막 저장: '+(DIAG.write?(DIAG.write.ok?'성공 ':'실패('+DIAG.write.err+') ')+ago(DIAG.write.at):'아직 없음'),'── 확인용 조회 ──','마지막: '+(DIAG.poll?(DIAG.poll.err?'오류('+DIAG.poll.err+') ':'정상 ')+ago(DIAG.poll.at):'아직 없음'),'마지막 오류: '+(DIAG.err?DIAG.err.code+' '+ago(DIAG.err.at):'없음')].join('\n');
}
function onTables(map){
 DIAG.sub.tables=Date.now();
 for(const [id,json] of Object.entries(map)){
  const idx=Number(String(id).replace('t',''));
  if(!Number.isInteger(idx))continue;
  try{
   const data=JSON.parse(json);const m=new Map();
   for(const [,line] of (Array.isArray(data.lines)?data.lines:[])){
    if(line&&typeof line.ko==='string')m.set(line.ko,{served:Math.min(line.served||0,line.quantity||0),qty:line.quantity||0,at:line.servedAt||0});
   }
   tableServed.set(idx+1,m);
  }catch{}
 }
 if(typeof render==='function'&&subscribed)render();
}
// 카운터에서 '나감'으로 표시한 내용(읽기 전용)
function servedOf(ticket,item){
 const m=tableServed.get(ticket.table);
 const v=m&&m.get(item.ko);
 return v&&v.served>0?v:null;
}
// 주방에서 메뉴별로 '완료'를 누릅니다(카운터의 '나감'과는 별개).
function setItemDone(ticket,item,done){
 const cd={...(ticket.cd||{})};
 if(done)cd[item.ko]=true;else delete cd[item.ko];
 // 메뉴를 전부 완료하면 주문서도 자동으로 완료(아래 '완료' 줄로 내려감)됩니다.
 const liveItems=ticket.items.filter(it=>!((ticket.cx&&ticket.cx[it.ko]||0)>=it.qty));
 const all=ticket.items.length>0&&liveItems.every(it=>cd[it.ko]);
 const next={...ticket,cd,done:all,doneAt:all?new Date().toISOString():null};
 tickets.set(ticket.id,next);render();
 if(el('doneDlg').open&&doneTicket&&doneTicket.id===ticket.id){doneTicket=next;fill(el('doneBody'),next);}
 kwrite({tickets:{[ticket.id]:JSON.stringify(next)}}).catch(()=>status('저장 실패 · 다시 눌러 주세요',true));
}
function fill(container,ticket,plain){
 container.replaceChildren();
 const add=(text,cls)=>{const p=document.createElement('p');p.className=cls||'';p.textContent=text;container.append(p);return p;};
 const head=add(tlabel(ticket,true),'t-head');
 if(ticket.extra){const tag=document.createElement('span');tag.className='extra';tag.textContent='추가 주문';head.append(' ',tag);}
 add(new Date(ticket.time).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})+(ticket.party?' · '+ticket.party+'명':'')+(ticket.staff?' · 주문 '+ticket.staff:'')+(ticket.togo&&ticket.togo.pickup?' · ⏰ 픽업 '+fmtPickup(ticket.togo.pickup):''),'t-sub');
 const rule=document.createElement('p');rule.className='t-rule';container.append(rule);
 for(const item of ticket.items){
  const cx=(ticket.cx&&ticket.cx[item.ko])||0;
  const gone=cx>=item.qty;
  const row=add(item.qty+' × '+item.ko+(item.s?' 🌶':'')+(item.total>item.qty?' (총 '+item.total+')':''),gone?'t-item t-cancel':'t-item');
  if(cx>0){const tag=document.createElement('span');tag.className='t-cxtag';tag.textContent=gone?'취소':'일부 취소 '+cx;row.append(' ',tag);}
  if(!plain&&!gone){
   const done=!!(ticket.cd&&ticket.cd[item.ko]);
   const wrap=document.createElement('div');wrap.className='t-itemact';
   const b=document.createElement('button');b.type='button';b.className='t-donebtn'+(done?' on':'');
   b.textContent=done?'✅ 완료':'🍳 완료';
   b.onclick=ev=>{ev.stopPropagation();if(!done)setItemDone(ticket,item,true);};
   wrap.append(b);
   if(done){const u=document.createElement('button');u.type='button';u.className='t-undo';u.textContent='↩';u.setAttribute('aria-label','완료 취소');u.onclick=ev=>{ev.stopPropagation();setItemDone(ticket,item,false);};wrap.append(u);}

function makeSilentAudio(){
 // 무음 파일을 계속 재생해 무음 스위치가 켜져 있어도 소리가 나게 합니다.
 const n=800,bytes=new Uint8Array(44+n);
 const w=(o,s)=>[...s].forEach((c,i)=>bytes[o+i]=c.charCodeAt(0));
 const u32=(o,v)=>{bytes[o]=v&255;bytes[o+1]=v>>8&255;bytes[o+2]=v>>16&255;bytes[o+3]=v>>24&255;};
 w(0,'RIFF');u32(4,36+n);w(8,'WAVE');w(12,'fmt ');u32(16,16);bytes[20]=1;bytes[22]=1;u32(24,8000);u32(28,8000);bytes[32]=1;bytes[34]=8;w(36,'data');u32(40,n);
 bytes.fill(128,44);
 const a=new Audio(URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})));
 a.loop=true;a.setAttribute('playsinline','');return a;
}

function chime(start,freq,volume){
 const master=audio.createGain();master.gain.value=volume;master.connect(audio.destination);
 [[1,1],[2.01,0.35],[3.0,0.12]].forEach(([mult,level])=>{
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type='sine';osc.frequency.value=freq*mult;
  gain.gain.setValueAtTime(0.0001,start);
  gain.gain.exponentialRampToValueAtTime(level,start+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+1.5);
  osc.connect(gain);gain.connect(master);osc.start(start);osc.stop(start+1.6);
 });
}

 const check=async()=>{
  try{
   const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});
   const j=await r.json();
   if(!(j&&j.build&&BUILD&&String(j.build)>BUILD)||recent()||printJobs>0)return;
   try{sessionStorage.setItem('stby-upd',String(Date.now()));}catch{}
   const u=new URL(location.href);u.searchParams.set('_',Date.now());location.replace(u.toString());
  }catch{}
 };
 check();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
 setInterval(check,2*60*1000);
})();
addEventListener('online',()=>status('연결됨'));
addEventListener('offline',()=>status('오프라인 · 연결되면 자동 갱신',true));
setInterval(render,60000);
start();
